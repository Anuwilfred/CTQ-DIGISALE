{"name": "Lead sourcing (RSS monitor)", "on": {"schedule": [{"cron": "0 6 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"rss-monitor": {"runs-on": "ubuntu-latest", "steps": [{"name": "Checkout", "uses": "actions/checkout@v4"}, {"name": "Set up Python", "uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Install dependencies", "run": "pip install requests feedparser"}, {"name": "Run RSS monitor", "run": "python lead_sourcing.py rss-monitor --feeds https://splash247.com/feed/ https://gcaptain.com/feed/ https://www.offshore-energy.biz/feed/ --output data/rss_signals.json"}, {"name": "Commit updated signals if changed", "run": "git config user.name 'ctorq-bot' && git config user.email 'actions@github.com' && git add data/rss_signals.json && git diff --cached --quiet || (git commit -m 'Update RSS lead signals [automated]' && git push)"}]}}}
