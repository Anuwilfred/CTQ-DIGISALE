name: Lead sourcing (RSS monitor)

# Watches maritime trade press RSS feeds for newbuild/contract signals,
# now including classification-agreement language (e.g. "to class",
# "classification agreement") -- class societies (DNV, ABS, Lloyd's
# Register, Bureau Veritas, ClassNK, RINA) get engaged right at project
# kickoff, so that's often the earliest public signal a project exists at
# all. Applies globally across whatever region each feed covers -- not
# restricted to one country. See lead_sourcing.py's NEWBUILD_KEYWORDS.
#
# Classification societies themselves generally don't publish their own
# public RSS feeds (DNV etc. push news via email subscription instead),
# so this watches real maritime trade press outlets that cover class
# announcements as part of their normal shipbuilding coverage.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rss-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run RSS monitor
        run: python lead_sourcing.py rss-monitor --feeds https://splash247.com/feed/ https://gcaptain.com/feed/ https://www.offshore-energy.biz/feed/ https://www.marinelog.com/feed/ --output data/rss_signals.json

      - name: Commit updated signals if changed
        run: |
          git config user.name 'ctorq-bot'
          git config user.email 'actions@github.com'
          git add data/rss_signals.json
          git diff --cached --quiet || (git commit -m 'Update RSS lead signals [automated]' && git push)
